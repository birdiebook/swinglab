<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwingLab-visaren {{PASS}}</title>
<!-- Mallen för tools/pc/visa.py (PLAN S6f). Datan bäddas in nedan; ingen server behövs. -->
<style>
:root {
  --bg: #111315; --yta: #1a1d20; --linje: #2c3136; --text: #e6e8ea; --dov: #8b9399;
  --vision: #ffffff; --mp: #ff9a1f; --rep: #35c9ff; --fo: #35c9ff; --dtl: #c58cff;
  --ok: #4cc38a; --fel: #ff5a4f; --varn: #f2c94c;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; padding: 10px 16px;
  border-bottom: 1px solid var(--linje); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.chip { padding: 2px 8px; border-radius: 10px; background: var(--yta); border: 1px solid var(--linje);
  white-space: nowrap; }
.chip.fel { border-color: var(--fel); color: var(--fel); }
.chip.ok { border-color: var(--ok); color: var(--ok); }
main { display: grid; grid-template-columns: 210px 1fr; min-height: calc(100vh - 44px); }
#lista { border-right: 1px solid var(--linje); overflow-y: auto; max-height: calc(100vh - 44px); }
#lista button { display: flex; justify-content: space-between; gap: 6px; width: 100%; text-align: left;
  padding: 6px 12px; border: 0; border-bottom: 1px solid var(--linje); background: none; color: var(--text);
  font: inherit; cursor: pointer; }
#lista button.vald { background: var(--yta); box-shadow: inset 3px 0 0 var(--rep); }
#lista .serie { color: var(--dov); padding: 8px 12px 4px; font-size: 11px; text-transform: uppercase; }
.m { font-size: 11px; padding: 0 5px; border-radius: 6px; border: 1px solid var(--linje); color: var(--dov); }
.m.ok { color: var(--ok); border-color: var(--ok); }
.m.fel { color: var(--fel); border-color: var(--fel); }
#hoger { padding: 12px 16px; min-width: 0; }
#bilder { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: start; }
.panel { position: relative; background: #000; border: 1px solid var(--linje); height: min(62vh, 640px); }
.panel video, .panel canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.panel video { object-fit: fill; }
.etikett { position: absolute; left: 0; right: 0; top: 0; padding: 4px 8px; font-size: 12px;
  background: linear-gradient(#000c, #0000); pointer-events: none; z-index: 2; }
.etikett b { font-weight: 600; }
.tom { position: absolute; left: 0; right: 0; bottom: 0; color: var(--dov); text-align: center;
  padding: 8px 12px 26px; z-index: 1; font-size: 12px; pointer-events: none; }
#tre { height: min(62vh, 640px); min-width: 280px; cursor: grab; }
#tre canvas { display: block; }
#styr { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
#styr button, #styr select { background: var(--yta); color: var(--text); border: 1px solid var(--linje);
  border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
#styr button:disabled { opacity: .35; cursor: default; }
#styr button.p.ar { border-color: var(--rep); color: var(--rep); }
#tid { flex: 1 1 240px; accent-color: var(--rep); }
#tidtext { font-variant-numeric: tabular-nums; min-width: 92px; }
#styr label { color: var(--dov); white-space: nowrap; }
#info { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.kort { background: var(--yta); border: 1px solid var(--linje); border-radius: 8px; padding: 10px 12px; }
.kort h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--dov); margin: 0 0 8px; }
.kort h3 { font-size: 13px; margin: 10px 0 4px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
td, th { padding: 2px 6px 2px 0; text-align: left; vertical-align: top; }
th { color: var(--dov); font-weight: 500; }
td.tal { text-align: right; white-space: nowrap; }
.dov { color: var(--dov); }
.rod { color: var(--fel); }
.gron { color: var(--ok); }
.forklaring span { margin-right: 12px; white-space: nowrap; }
.forklaring i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
@media (max-width: 900px) {
  main { grid-template-columns: 1fr; }
  #lista { max-height: 180px; border-right: 0; border-bottom: 1px solid var(--linje); }
  #bilder { grid-template-columns: 1fr 1fr; }
  #tre { grid-column: 1 / -1; }
  .panel { height: 52vh; }
}
</style>
</head>
<body>
<header>
  <h1>SwingLab · pass {{PASS}}</h1>
  <span id="paketchips"></span>
  <span id="tredchip"></span>
</header>
<main>
  <nav id="lista" aria-label="Svingarna"></nav>
  <div id="hoger">
    <div id="bilder">
      <div class="panel" id="panel0"><video muted playsinline preload="auto"></video><canvas></canvas>
        <div class="etikett"></div><div class="tom"></div></div>
      <div class="panel" id="panel1"><video muted playsinline preload="auto"></video><canvas></canvas>
        <div class="etikett"></div><div class="tom"></div></div>
      <div class="panel" id="tre"><div class="etikett">3D · utan markörer · dra för att vrida, hjulet zoomar</div>
        <div class="tom"></div></div>
    </div>
    <div id="styr">
      <button id="spela" title="Mellanslag">▶</button>
      <select id="fart" title="Farten">
        <option value="0.0625">1/16</option><option value="0.125">1/8</option>
        <option value="0.25" selected>1/4</option><option value="0.5">1/2</option><option value="1">1×</option>
      </select>
      <button id="bak" title="← en ruta (shift: tio)">◀︎</button>
      <input id="tid" type="range" min="0" max="1" step="0.0001">
      <button id="fram" title="→ en ruta (shift: tio)">▶︎</button>
      <span id="tidtext"></span>
      <span id="pknappar"></span>
      <label><input type="checkbox" id="v_vision" checked> Vision</label>
      <label><input type="checkbox" id="v_mp" checked> MediaPipe</label>
      <label><input type="checkbox" id="v_rep" checked> 3D i bilden</label>
      <label><input type="checkbox" id="v_bana" checked> banor</label>
    </div>
    <div class="forklaring dov" id="forklaring"></div>
    <div id="info">
      <section class="kort" id="kort_sving"></section>
      <section class="kort" id="kort_tred"></section>
      <section class="kort" id="kort_paket"></section>
    </div>
  </div>
</main>
<script type="application/json" id="data">{{DATA}}</script>
<script src="{{THREE_JS}}" crossorigin="anonymous"></script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("data").textContent);
const T = D.tre_d;
const RUTA = 1 / 240;
const P_ORDNING = ["P1", "P2", "P3", "P4", "P5", "P6", "P7", "P8", "P9", "P10"];
const VYNAMN = { dtl: "DTL", fo: "FO" };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const tal = (v, d = 1) => v == null || !isFinite(v) ? "–" : v.toFixed(d).replace("-", "−").replace(".", ",");
const farg = (namn) => getComputedStyle(document.documentElement).getPropertyValue(namn).trim();

let radIx = 0, tau = 0, spelar = false, fart = 0.25, senast = null;
const visa = { vision: true, mp: true, rep: true, bana: true };

// --- tiden ----------------------------------------------------------------------------
function narmast(t, x) {          // index för tiden närmast x i den stigande listan t
  let lo = 0, hi = t.length - 1;
  if (hi < 0) return -1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (t[m] < x) lo = m; else hi = m; }
  return Math.abs(t[lo] - x) <= Math.abs(t[hi] - x) ? lo : hi;
}
function radensPar(r) { return r.par == null ? null : T.par[r.par]; }
function spann(r) {
  let a = Infinity, b = -Infinity;
  for (const v of r.vyer) if (v && v.t.length) { a = Math.min(a, v.t[0] - v.t0); b = Math.max(b, v.t[v.t.length - 1] - v.t0); }
  const p = radensPar(r);
  if (p && p.t.length) { a = Math.min(a, p.t[0]); b = Math.max(b, p.t[p.t.length - 1]); }
  return isFinite(a) ? [a, b] : [-1, 1];
}
function positioner(r) {         // P-positionerna på radens tid: FO:s, annars DTL:s
  const ut = {};
  for (const v of [r.vyer[1], r.vyer[0]]) if (v) for (const [k, t] of Object.entries(v.positioner || {}))
    if (!(k in ut) && t != null) ut[k] = t;
  return ut;
}

// --- 2D: panelerna ----------------------------------------------------------------------
const paneler = [0, 1].map((i) => {
  const el = $("panel" + i);
  return { i, el, video: el.querySelector("video"), canvas: el.querySelector("canvas"),
    etikett: el.querySelector(".etikett"), tom: el.querySelector(".tom"), vy: null, src: null };
});
for (const p of paneler) {
  p.video.addEventListener("error", () => {
    p.tom.textContent = "Klippet går inte att spela i den här webbläsaren (HEVC?). Lederna visas ändå.";
    p.tom.style.display = "block";
  });
  p.video.addEventListener("loadeddata", () => {
    if (!p.vy) return;
    p.tom.style.display = "none";
    const kt = klippTid(p.vy);
    if (!spelar && kt >= 0 && kt <= p.video.duration) p.video.currentTime = kt;   // första sökningen
    rita();
  });
}
function klippTid(v) { return tau + v.t0 + v.klipp_t; }
function stallPanel(p, v) {
  p.vy = v;
  const pk = D.paket[p.i];
  if (!pk) { p.el.style.display = "none"; return; }
  p.etikett.innerHTML = `<b style="color:var(--${pk.vy})">${VYNAMN[pk.vy] || esc(pk.vy)}</b> · ${esc(pk.fil)}`
    + (v ? ` · ${esc(v.id)}` : "");
  const w = v ? v.w : 1080, h = v ? v.h : 1920;
  p.el.style.aspectRatio = `${w} / ${h}`;
  const src = v && v.klipp ? v.klipp : null;
  if (src !== p.src) {
    p.src = src;
    if (src) { p.video.src = src; p.video.style.display = ""; } else { p.video.removeAttribute("src"); p.video.load(); p.video.style.display = "none"; }
  }
  p.tom.style.display = "block";
  p.tom.textContent = !v ? "Den här vyn filmade inte svingen." : src ? "Klippet laddas …" : "Inget klipp i paketet: bara lederna.";
  if (v && !src) p.tom.style.display = "block";
}
function linjer(ctx, xy, skala, ben, stil, bredd, streck) {
  ctx.strokeStyle = stil; ctx.fillStyle = stil; ctx.lineWidth = bredd; ctx.setLineDash(streck || []);
  ctx.beginPath();
  for (const [a, b] of ben) {
    const xa = xy[2 * a], ya = xy[2 * a + 1], xb = xy[2 * b], yb = xy[2 * b + 1];
    if (xa == null || xb == null) continue;
    ctx.moveTo(xa * skala, ya * skala); ctx.lineTo(xb * skala, yb * skala);
  }
  ctx.stroke(); ctx.setLineDash([]);
  for (let j = 0; j < xy.length / 2; j++) {
    if (xy[2 * j] == null) continue;
    ctx.beginPath(); ctx.arc(xy[2 * j] * skala, xy[2 * j + 1] * skala, bredd * 1.4, 0, 2 * Math.PI); ctx.fill();
  }
}
function projicera(kam, K, X) {   // världspunkt → pixlar: K · R · (X − C)
  const d = [X[0] - kam.C[0], X[1] - kam.C[1], X[2] - kam.C[2]];
  const c = kam.R.map((r) => r[0] * d[0] + r[1] * d[1] + r[2] * d[2]);
  if (!(c[2] > 1e-6)) return [null, null];
  return [K[0][0] * c[0] / c[2] + K[0][1] * c[1] / c[2] + K[0][2], K[1][1] * c[1] / c[2] + K[1][2]];
}
function ritaPanel(p) {
  const { canvas, vy: v } = p;
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(r.width * dpr)) { canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr); }
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!v) return;
  const skala = canvas.width / v.w, lw = Math.max(1.5, 2 * dpr);
  const tv = tau + v.t0;
  if (visa.mp && v.mp) {
    const k = narmast(v.mp.t, tv);
    if (k >= 0 && Math.abs(v.mp.t[k] - tv) < 0.03) linjer(ctx, v.mp.xy[k], skala, D.ben, farg("--mp"), lw);
  }
  if (visa.vision) {
    const k = narmast(v.t, tv);
    if (k >= 0 && Math.abs(v.t[k] - tv) < 0.03) linjer(ctx, v.xy[k], skala, D.ben, farg("--vision"), lw);
  }
  const par = radensPar(D.rader[radIx]);
  const u = par ? T.uppstallningar[par.uppstallning] : null;
  if (visa.rep && par && u && u.kameror) {
    const k = narmast(par.t, tau);
    if (k >= 0 && Math.abs(par.t[k] - tau) < 0.03) {
      const vy = D.paket[p.i].vy, kam = u.kameror[vy], K = vy === "fo" ? par.KA : par.KB, X = par.P[k], xy = [];
      for (let j = 0; j < X.length / 3; j++) {
        const q = X[3 * j] == null ? [null, null] : projicera(kam, K, [X[3 * j], X[3 * j + 1], X[3 * j + 2]]);
        xy.push(q[0], q[1]);
      }
      linjer(ctx, xy, skala, D.ben, farg("--rep"), lw, [6 * dpr, 4 * dpr]);
    }
  }
  // fasens namn när τ står på en position
  const pos = positioner(D.rader[radIx]);
  for (const [k, t] of Object.entries(pos)) if (Math.abs(t - tau) < RUTA / 2 + 1e-6) {
    ctx.fillStyle = farg("--rep"); ctx.font = `${12 * dpr}px system-ui`; ctx.fillText(k, 8 * dpr, canvas.height - 10 * dpr);
  }
}

// --- 3D -------------------------------------------------------------------------------
const tre = { ok: typeof THREE !== "undefined", el: $("tre") };
function v3(x) { return new THREE.Vector3(x[0], x[2], -x[1]); }   // världen z upp → three y upp
function textSprite(text, stil) {
  const c = document.createElement("canvas"), ctx = c.getContext("2d"), rader = text.split("\n");
  c.width = 1024; c.height = 64 * rader.length;
  ctx.font = "44px system-ui"; ctx.fillStyle = stil; ctx.textAlign = "center";
  rader.forEach((r, i) => ctx.fillText(r, 512, 48 + 64 * i));
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false }));
  s.scale.set(2.4, 0.15 * rader.length, 1);
  return s;
}
if (tre.ok) {
  tre.renderer = new THREE.WebGLRenderer({ antialias: true });
  tre.renderer.setPixelRatio(window.devicePixelRatio || 1);
  tre.el.appendChild(tre.renderer.domElement);
  tre.scen = new THREE.Scene();
  tre.scen.background = new THREE.Color(farg("--bg"));
  tre.kamera = new THREE.PerspectiveCamera(40, 1, 0.05, 500);
  tre.mal = new THREE.Vector3(); tre.az = 0.8; tre.el_ = 0.6; tre.avst = 6;
  tre.grupp = new THREE.Group(); tre.scen.add(tre.grupp);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(D.ben.length * 6), 3));
  tre.figur = new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: farg("--vision") }));
  const pg = new THREE.BufferGeometry();
  pg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(D.leder.length * 3), 3));
  tre.punkter = new THREE.Points(pg, new THREE.PointsMaterial({ color: farg("--vision"), size: 0.05 }));
  tre.scen.add(tre.figur, tre.punkter);
  let drag = null;
  tre.el.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; tre.el.setPointerCapture(e.pointerId); });
  tre.el.addEventListener("pointerup", () => { drag = null; });
  tre.el.addEventListener("pointermove", (e) => {
    if (!drag) return;
    tre.az -= (e.clientX - drag[0]) * 0.008; tre.el_ = Math.max(-1.4, Math.min(1.5, tre.el_ + (e.clientY - drag[1]) * 0.008));
    drag = [e.clientX, e.clientY]; rita();
  });
  tre.el.addEventListener("wheel", (e) => { e.preventDefault(); tre.avst *= Math.exp(e.deltaY * 0.001); rita(); }, { passive: false });
  tre.el.addEventListener("dblclick", () => { tre.az = 0.8; tre.el_ = 0.6; tre.avst = tre.avst0; rita(); });
} else {
  tre.el.querySelector(".tom").textContent = "three.js laddades inte (inget nät?): 3D visas inte, resten gör det.";
}
function byggScen() {
  if (!tre.ok) return;
  tre.grupp.clear();
  const r = D.rader[radIx], par = radensPar(r);
  const u = par ? T.uppstallningar[par.uppstallning] : T.uppstallningar.find((x) => x.kameror);
  const tom = tre.el.querySelector(".tom");
  tom.style.display = "none";
  tre.figur.visible = tre.punkter.visible = !!par;
  if (!u || !u.kameror) {
    tom.style.display = "block";
    tom.textContent = T.hoppat ? `Ingen 3D: ${T.hoppat}` : "Ingen 3D för den här svingen.";
    return;
  }
  if (!par) { tom.style.display = "block"; tom.textContent = "Svingen är inte parad: bara kamerorna visas."; }
  // golvet och målet: figurens fotleder och höfter, annars mitt emellan kamerorna
  const fA = u.kameror.fo.C, fB = u.kameror.dtl.C;
  let mal = [(fA[0] + fB[0]) / 2, (fA[1] + fB[1]) / 2, (fA[2] + fB[2]) / 2], golv = Math.min(fA[2], fB[2]) - 1.2;
  if (par) {
    const fot = [], hoft = [[], [], []];
    const iF = [D.leder.indexOf("fotled_v"), D.leder.indexOf("fotled_h")], iH = [D.leder.indexOf("hoft_v"), D.leder.indexOf("hoft_h")];
    for (const X of par.P) {
      for (const j of iF) if (X[3 * j + 2] != null) fot.push(X[3 * j + 2]);
      for (const j of iH) if (X[3 * j] != null) for (let a = 0; a < 3; a++) hoft[a].push(X[3 * j + a]);
    }
    const med = (a) => { const s = [...a].sort((x, y) => x - y); return s.length ? s[s.length >> 1] : null; };
    if (fot.length) golv = med(fot);
    if (hoft[0].length) mal = hoft.map(med);
  }
  tre.mal = v3(mal);
  const grid = new THREE.GridHelper(10, 20, 0x3a4046, 0x24282c);
  grid.position.y = golv; tre.grupp.add(grid);
  // kamerorna: pyramiden ur K och R, linjen till målet och paketets etikett
  for (const vy of ["fo", "dtl"]) {
    const k = u.kameror[vy], pk = D.paket[vy === "fo" ? 1 : 0] || {};   // med 3D är paketen [DTL, FO]
    const stil = farg("--" + vy), s = 0.45, C = k.C, f = k.K[0][0], pts = [];
    const hornet = [[-k.w / 2, -k.h / 2], [k.w / 2, -k.h / 2], [k.w / 2, k.h / 2], [-k.w / 2, k.h / 2]].map(([x, y]) => {
      const c = [x / f * s, y / f * s, s];   // kamerans ram → världen: Rᵀ c + C
      return [0, 1, 2].map((a) => k.R[0][a] * c[0] + k.R[1][a] * c[1] + k.R[2][a] * c[2] + C[a]);
    });
    for (let a = 0; a < 4; a++) pts.push(v3(C), v3(hornet[a]), v3(hornet[a]), v3(hornet[(a + 1) % 4]));
    // uppåt i bilden: en kort pinne från övre kanten
    const upp = [0, 1, 2].map((a) => (hornet[0][a] + hornet[1][a]) / 2), uppi = [0, 1, 2].map((a) => upp[a] - k.R[1][a] * s * 0.3);
    pts.push(v3(upp), v3(uppi));
    tre.grupp.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: stil })));
    const linje = new THREE.Line(new THREE.BufferGeometry().setFromPoints([v3(C), tre.mal.clone()]),
      new THREE.LineDashedMaterial({ color: stil, dashSize: 0.1, gapSize: 0.08, transparent: true, opacity: 0.5 }));
    linje.computeLineDistances(); tre.grupp.add(linje);
    const etikett = textSprite(`${VYNAMN[vy]}-kameran\n${pk.fil || ""}\nmärkt ${(pk.vy || "?").toUpperCase()}`, stil);
    etikett.position.copy(v3(C)).add(new THREE.Vector3(0, 0.6, 0)); tre.grupp.add(etikett);
  }
  // banorna: båda handlederna över hela svingen
  if (par) {
    for (const [led, stil] of [["handled_v", farg("--rep")], ["handled_h", farg("--mp")]]) {
      const j = D.leder.indexOf(led), pts = [];
      for (const X of par.P) if (X[3 * j] != null) pts.push(v3([X[3 * j], X[3 * j + 1], X[3 * j + 2]]));
      const bana = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: stil, transparent: true, opacity: 0.45 }));
      bana.visible = visa.bana; bana.userData.bana = true; tre.grupp.add(bana);
    }
  }
  // vyn: mitt i figuren och båda kamerorna, så långt bort att alla tre syns
  const punkter = [tre.mal.clone(), v3(u.kameror.fo.C), v3(u.kameror.dtl.C)];
  const mitt = punkter.reduce((a, q) => a.add(q), new THREE.Vector3()).multiplyScalar(1 / 3);
  const radie = Math.max(...punkter.map((q) => q.distanceTo(mitt))) + 0.8;
  tre.mal = mitt;
  tre.avst0 = Math.max(3, radie / Math.sin((tre.kamera.fov / 2) * Math.PI / 180)); tre.avst = tre.avst0;
}
function ritaTre() {
  if (!tre.ok) return;
  const r = tre.el.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (tre.renderer.domElement.width !== Math.round(w * tre.renderer.getPixelRatio())) {
    tre.renderer.setSize(w, h); tre.kamera.aspect = w / h; tre.kamera.updateProjectionMatrix();
  }
  const par = radensPar(D.rader[radIx]);
  if (par) {
    const k = narmast(par.t, tau), X = par.P[k];
    const pos = tre.figur.geometry.attributes.position, pp = tre.punkter.geometry.attributes.position;
    const syns = Math.abs(par.t[k] - tau) < 0.03;
    D.ben.forEach(([a, b], i) => {
      const ok = syns && X[3 * a] != null && X[3 * b] != null;
      const A = ok ? v3([X[3 * a], X[3 * a + 1], X[3 * a + 2]]) : new THREE.Vector3(NaN, NaN, NaN);
      const B = ok ? v3([X[3 * b], X[3 * b + 1], X[3 * b + 2]]) : A;
      pos.setXYZ(2 * i, A.x, A.y, A.z); pos.setXYZ(2 * i + 1, B.x, B.y, B.z);
    });
    for (let j = 0; j < D.leder.length; j++) {
      const ok = syns && X[3 * j] != null, q = ok ? v3([X[3 * j], X[3 * j + 1], X[3 * j + 2]]) : { x: NaN, y: NaN, z: NaN };
      pp.setXYZ(j, q.x, q.y, q.z);
    }
    pos.needsUpdate = pp.needsUpdate = true;
  }
  for (const o of tre.grupp.children) if (o.userData.bana) o.visible = visa.bana;
  const c = Math.cos(tre.el_);
  tre.kamera.position.set(tre.mal.x + tre.avst * c * Math.sin(tre.az), tre.mal.y + tre.avst * Math.sin(tre.el_),
    tre.mal.z + tre.avst * c * Math.cos(tre.az));
  tre.kamera.lookAt(tre.mal);
  tre.renderer.render(tre.scen, tre.kamera);
}

// --- styrningen ---------------------------------------------------------------------------
function rita() {
  const [a, b] = spann(D.rader[radIx]);
  const tid = $("tid");
  tid.min = a; tid.max = b; tid.value = tau;
  $("tidtext").textContent = `${tal(tau, 3)} s`;
  for (const knapp of document.querySelectorAll("#pknappar button")) {
    const t = positioner(D.rader[radIx])[knapp.dataset.p];
    knapp.classList.toggle("ar", t != null && Math.abs(t - tau) < RUTA / 2 + 1e-6);
  }
  paneler.forEach(ritaPanel);
  ritaTre();
}
function sok(t) {
  const [a, b] = spann(D.rader[radIx]);
  tau = Math.min(b, Math.max(a, t));
  for (const p of paneler) if (p.vy && p.src && p.video.readyState >= 1) {
    const kt = klippTid(p.vy);
    if (kt >= 0 && kt <= p.video.duration) p.video.currentTime = kt;
  }
  rita();
}
function spela(pa) {
  spelar = pa;
  $("spela").textContent = pa ? "❚❚" : "▶";
  for (const p of paneler) {
    if (!p.vy || !p.src) continue;
    p.video.playbackRate = fart;
    if (pa) p.video.play().catch(() => {}); else p.video.pause();
  }
  senast = null;
  if (pa) requestAnimationFrame(steg);
}
function steg(nu) {
  if (!spelar) return;
  const [a, b] = spann(D.rader[radIx]);
  // Klockan: det första klippet som spelar, annars sidans egen.
  const m = paneler.find((p) => p.vy && p.src && !p.video.paused && p.video.readyState >= 2);
  if (m) tau = m.video.currentTime - m.vy.t0 - m.vy.klipp_t;
  else if (senast != null) tau += (nu - senast) / 1000 * fart;
  senast = nu;
  if (tau > b) { sok(a); }
  for (const p of paneler) {
    if (p === m || !p.vy || !p.src || p.video.readyState < 1) continue;
    const kt = klippTid(p.vy);
    if (kt < 0 || kt > p.video.duration) { if (!p.video.paused) p.video.pause(); continue; }
    if (p.video.paused) p.video.play().catch(() => {});
    if (Math.abs(p.video.currentTime - kt) > 0.04) p.video.currentTime = kt;
  }
  rita();
  requestAnimationFrame(steg);
}
function valjRad(i) {
  radIx = Math.max(0, Math.min(D.rader.length - 1, i));
  const r = D.rader[radIx];
  document.querySelectorAll("#lista button").forEach((b) => b.classList.toggle("vald", +b.dataset.i === radIx));
  paneler.forEach((p) => stallPanel(p, r.vyer[p.i]));
  const pos = positioner(r);
  $("pknappar").innerHTML = P_ORDNING.map((k) => `<button class="p" data-p="${k}" ${pos[k] == null ? "disabled" : ""}>${k}</button>`).join("");
  for (const b of document.querySelectorAll("#pknappar button")) b.onclick = () => { spela(false); sok(pos[b.dataset.p]); };
  byggScen();
  kortSving();
  const t0 = pos.P1 != null ? pos.P1 : spann(r)[0];
  sok(t0);
}

// --- korten -------------------------------------------------------------------------------
function mattNamn(k) { const i = D.matt_info[k] || {}; return i.namn || k; }
function enhet(k) { return (D.matt_info[k] || {}).enhet || ""; }
function decimaler(k) { const e = enhet(k); return e === "" || e === "s" ? 2 : e === "ms" || e === "°/s" ? 0 : 1; }
function kortSving() {
  const r = D.rader[radIx], par = radensPar(r);
  const nycklar = [...new Set(r.vyer.flatMap((v) => v ? Object.keys(v.matt) : []))].sort();
  let h = `<h2>Svingen ${esc(r.namn)} · serie ${r.serie}</h2>`;
  for (const v of r.vyer) if (v && v.fel) h += `<div class="rod">${esc(v.id)}: ${esc(v.fel)}</div>`;
  if (par) {
    const u = T.uppstallningar[par.uppstallning];
    h += `<h3>3D</h3><table>`;
    h += `<tr><td>synken (DTL före FO)</td><td class="tal">${tal(par.synk_s * 1000, 1)} ms</td></tr>`;
    h += `<tr><td>återprojektionen, median</td><td class="tal">${tal(par.aterprojektion_px, 1)} px</td></tr>`;
    for (const m of Object.keys(D.matt_info).filter((k) => k in par.matt))
      h += `<tr><td title="${esc((D.matt_info[m] || {}).vad)}">${esc(mattNamn(m))}</td><td class="tal">${tal(par.matt[m], 1)}°</td></tr>`;
    h += `</table>`;
    if (u.hoppat) h += `<div class="rod">Uppställningen hoppades över: ${esc(u.hoppat)}. Figuren visas för felsökning, inte som mått.</div>`;
    else if (par.fel) h += `<div class="rod">Inga 3D-mått: ${esc(par.fel)}</div>`;
  }
  h += `<h3>2D</h3><table><tr><th>Mått</th>${r.vyer.map((v, i) => v ? `<th class="tal">${VYNAMN[D.paket[i].vy] || ""}</th>` : "").join("")}</tr>`;
  for (const k of nycklar) {
    h += `<tr><td title="${esc((D.matt_info[k] || {}).vad)}">${esc(k)}</td>`;
    for (const v of r.vyer) if (v) h += `<td class="tal">${k in v.matt ? tal(v.matt[k], decimaler(k)) + " " + enhet(k) : ""}</td>`;
    h += `</tr>`;
  }
  h += `</table>`;
  $("kort_sving").innerHTML = h;
}
function kortTred() {
  let h = `<h2>3D och kamerorna</h2>`;
  h += T.hoppat ? `<div class="rod"><b>3D hoppades över:</b> ${esc(T.hoppat)}</div>` : `<div class="gron">3D räknades.</div>`;
  const pa = T.parning;
  if (pa) h += `<div class="dov">Parningen ur ${esc(pa.kalla)}: ${pa.par} par; oparade ${pa.oparade.dtl} (DTL), ${pa.oparade.fo} (FO)`
    + (pa.par_json_fel ? `; par.json lästes inte (${esc(pa.par_json_fel)})` : "") + `</div>`;
  for (const u of T.uppstallningar) {
    h += `<h3>Serie ${u.serie.dtl} (DTL) mot ${u.serie.fo} (FO) · ${u.slag} slag</h3><table>`;
    if (u.sampson_px != null) {
      const sOk = u.sampson_px <= T.sparr_px, vOk = u.vinkel_ok;
      h += `<tr><td>Sampson-felet, median</td><td class="tal ${sOk ? "gron" : "rod"}">${tal(u.sampson_px, 1)} px</td><td class="dov">spärren ${tal(T.sparr_px, 0)} px</td></tr>`;
      h += `<tr><td>vinkeln mellan kamerorna</td><td class="tal ${vOk ? "gron" : "rod"}">${tal(u.vinkel_mellan_kamerorna, 0)}°</td><td class="dov">${T.vinkel_ok[0]}–${T.vinkel_ok[1]}°</td></tr>`;
      h += `<tr><td>lodlinjen</td><td colspan="2">${u.lodlinje === "manifest" ? "telefonernas" : "kamerornas vågräta"}`
        + (u.lodlinje_mot_vagrata != null ? ` (${tal(u.lodlinje_mot_vagrata, 1)}° mot de vågräta)` : "") + `</td></tr>`;
      h += `<tr><td>skalan i bilden</td><td colspan="2" class="dov">${u.skala === "langd" ? `figurens längd (${tal(D.langd_m, 2)} m)` : "okänd: 1 = avståndet mellan kamerorna"}</td></tr>`;
    }
    h += `</table>`;
    if (u.hoppat) h += `<div class="rod">Hoppad: ${esc(u.hoppat)}</div>`;
    if (u.synk === "klicket") h += `<div class="dov">Kedjan nådde inte synken: figuren står på klicket.</div>`;
  }
  if (T.osaker.length) h += `<h3>Osäkert</h3>` + T.osaker.map((o) => `<div class="varn" style="color:var(--varn)">${esc(o)}</div>`).join("");
  if (T.utelamnade.length) h += `<h3>Parade men inte mätta</h3><table>` + T.utelamnade.map((x) => `<tr><td>${esc(x.dtl)} · ${esc(x.fo)}</td><td>${esc(x.skal)}</td></tr>`).join("") + `</table>`;
  const ses = Object.entries(T.session);
  if (ses.length) h += `<h3>Passets median (minst ${T.min_slag} slag)</h3><table>` + ses.map(([m, v]) => `<tr><td>${esc(mattNamn(m))}</td><td class="tal">${tal(v, 1)}°</td></tr>`).join("") + `</table>`;
  $("kort_tred").innerHTML = h;
}
function kortPaket() {
  let h = `<h2>Paketen</h2><table>`;
  D.paket.forEach((p, i) => {
    h += `<tr><td><b style="color:var(--${p.vy})">${i === 0 ? "vänster" : "höger"}</b></td><td>${esc(p.fil)}</td></tr>`
      + `<tr><td></td><td class="dov">märkt <b>${esc(p.vy.toUpperCase())}</b> · telefon ${esc(p.telefon.modell)} (${esc(p.telefon.roll)}) · ${esc(p.spelhand)} · ${p.slag} slag, ${p.klipp} klipp`
      + (p.avstand_m != null ? ` · ${tal(p.avstand_m, 1)} m till bollen` : "") + `</td></tr>`;
  });
  h += `</table><div class="dov" style="margin-top:6px">Byggd ${esc(D.skapad)} av tools/pc/visa.py.`
    + (D.mediapipe ? "" : " MediaPipes leder saknas: kör tools/pc/s3_facit.py på paketen.") + `</div>`;
  $("kort_paket").innerHTML = h;
}

// --- start -----------------------------------------------------------------------------
(function start() {
  const chips = D.paket.map((p) => `<span class="chip">${esc(p.fil)} · märkt ${esc(p.vy.toUpperCase())}</span>`).join(" ");
  $("paketchips").innerHTML = chips;
  $("tredchip").innerHTML = T.hoppat ? `<span class="chip fel">3D hoppades över: ${esc(T.hoppat)}</span>`
    : `<span class="chip ok">3D: ${T.par.filter((p) => Object.keys(p.matt).length).length} svingar mätta</span>`;
  $("forklaring").innerHTML = `<span><i style="background:var(--vision)"></i>Vision</span>`
    + `<span><i style="background:var(--mp)"></i>MediaPipe (S3)</span>`
    + `<span><i style="background:var(--rep)"></i>3D projicerad tillbaka</span>`
    + `<span><i style="background:var(--dtl)"></i>DTL-kameran</span><span><i style="background:var(--fo)"></i>FO-kameran</span>`
    + `<span class="dov">Tiden: 0 = träffen (FO:s klocka).</span>`;
  let h = "", serie = null;
  D.rader.forEach((r, i) => {
    if (r.serie !== serie) { serie = r.serie; h += `<div class="serie">Serie ${serie}</div>`; }
    const par = radensPar(r), u = par ? T.uppstallningar[par.uppstallning] : null;
    const m = !par ? `<span class="m">2D</span>` : u.hoppat ? `<span class="m fel" title="${esc(u.hoppat)}">spärren</span>`
      : Object.keys(par.matt).length ? `<span class="m ok">3D</span>` : `<span class="m" title="${esc(par.fel)}">3D –</span>`;
    const fel = r.vyer.filter((v) => v && v.fel).map((v) => v.fel).join("; ");
    h += `<button data-i="${i}" title="${esc(fel)}"><span>${esc(r.namn)}</span>${m}</button>`;
  });
  $("lista").innerHTML = h || `<div class="serie">Inga svingar med leder</div>`;
  for (const b of document.querySelectorAll("#lista button")) b.onclick = () => { spela(false); valjRad(+b.dataset.i); };
  $("spela").onclick = () => spela(!spelar);
  $("fart").onchange = (e) => { fart = +e.target.value; for (const p of paneler) p.video.playbackRate = fart; };
  $("tid").oninput = (e) => { spela(false); sok(+e.target.value); };
  $("bak").onclick = (e) => { spela(false); sok(tau - RUTA * (e.shiftKey ? 10 : 1)); };
  $("fram").onclick = (e) => { spela(false); sok(tau + RUTA * (e.shiftKey ? 10 : 1)); };
  for (const k of ["vision", "mp", "rep", "bana"]) $("v_" + k).onchange = (e) => { visa[k] = e.target.checked; rita(); };
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === " ") { e.preventDefault(); spela(!spelar); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault(); spela(false); sok(tau + (e.key === "ArrowLeft" ? -1 : 1) * RUTA * (e.shiftKey ? 10 : 1));
    } else if (e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); spela(false); valjRad(radIx + (e.key === "ArrowUp" ? -1 : 1)); }
  });
  window.addEventListener("resize", rita);
  kortTred(); kortPaket();
  if (D.rader.length) valjRad(0);
})();
</script>
</body>
</html>

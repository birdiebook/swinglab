# Kompileringsprovet och simulatorprovet (BESLUT B20, S2_SPEC §10.2). Utan Mac
# kompileras App-koden annars först i TestFlight-bygget. Repot är publikt, så
# GitHubs macOS-maskin kostar inget (BESLUT B7). Två byggen: arkivet för telefonen
# i TestFlights konfiguration (Release, utan signering), och simulatorbygget som
# provet körs i (Release med ENABLE_TESTABILITY).
#
# Resultatet läses utan gh, på grenen ci-resultat (som test.yml, men egen fil så
# att de två inte skriver över varandra):
#   git fetch origin ci-resultat && git show origin/ci-resultat:resultat/<sha>.kompilera.txt
# Bilderna som provet ritade ligger bredvid som resultat/<sha>.<namn>.png (startvy, kvitto, slag, traff).
# testflight.yml vägrar en commit som inte är grön här.
#
# Skärmbilderna (PLAN S4i, BESLUT B100, METOD MS40–MS41): miljön är låst (avbilden, Xcode och
# simulatorn nedan), galleriet jämförs med referenserna i Prov/Referenser, och en ändrad skärm
# blir RÖTT med referensen, den nya och skillnaden i resultat/<sha>.skillnad.<namn>.png.
# Huvudskärmarna i tre textstorlekar och mörkt/ljust: resultat/<sha>.matris.<namn>.png, och vad
# som faktiskt finns på maskinen: resultat/<sha>.miljo.txt.
# Referenserna spelas in här, aldrig på en Mac: kör kompilera för hand med spela_in (Actions →
# kompilera → Run workflow, eller `gh workflow run kompilera.yml --ref <gren> -f spela_in=true`).
# Då ritas galleriet, kopieras till Prov/Referenser och committas till grenen.
#
# Kontraktet med PC:n (S2f, BESLUT B27): simulatorprovet skriver två paket med appens
# Export (påhittad film, påhittade leder) till /tmp/swinglab_prov/paket, och PC:ns
# tools/pc/paket.py och session.py läser dem (tools/tests/test_appens_paket.py). Därför
# körs flödet också när PC-sidan ändras. Paketen sparas som artefakten swinglab-paket.

name: kompilera

on:
  push:
    paths: ["App/**", "Prov/**", "SwingLabKit/**", "project.yml", ".github/workflows/kompilera.yml",
            "tools/pc/**", "tools/tests/test_appens_paket.py", "klubbmodell.json", "tools/hamta_klubbmodell.py"]
  workflow_dispatch:
    inputs:
      spela_in:
        description: "Spela in skärmbildernas referenser (Prov/Referenser) och committa dem till grenen (BESLUT B100)"
        type: boolean
        default: false

concurrency:
  group: kompilera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kompilera:
    if: github.repository == 'birdiebook/swinglab'
    # BESLUT B100: den låsta miljön. Avbilden, Xcode och simulatorn byts tillsammans, i samma
    # commit som referenserna spelas in på nytt; inte macos-latest och latest-stable, som flyttar.
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      XCODE_APP: /Applications/Xcode_26.6.app
      SIM_IPHONE: iPhone 17 Pro
      SIM_IOS: "26.5"
      SPELA_IN: ${{ github.event_name == 'workflow_dispatch' && inputs.spela_in && 'ja' || 'nej' }}
    steps:
      - uses: actions/checkout@v4

      # Vad maskinen har, ur maskinen själv (resultat/<sha>.miljo.txt), och den låsta Xcode och
      # simulatorn. Saknas den låsta simulatorn körs provet på den nyaste iPhonen (iOS 18.2 eller
      # senare), men skärmbilderna jämförs inte: det blir RÖTT tills låsningen byts (BESLUT B100).
      - name: Den låsta miljön (BESLUT B100)
        id: miljo
        run: |
          set -euo pipefail
          {
            echo "avbild ${ImageOS:-?} ${ImageVersion:-?} · $(sw_vers -productName) $(sw_vers -productVersion) ($(sw_vers -buildVersion)) · $(uname -m) · $(sysctl -n hw.ncpu) kärnor"
            echo "== Xcode i /Applications"
            ls -d /Applications/Xcode*.app
          } > miljo.txt
          if [ ! -d "$XCODE_APP" ]; then
            echo "RÖTT: den låsta Xcode saknas: $XCODE_APP" | tee -a miljo.txt
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          {
            echo "== vald: $XCODE_APP: $(xcodebuild -version | tr '\n' ' ')"
            echo "== körtiderna"
            xcrun simctl list runtimes
            echo "== enheterna"
            xcrun simctl list devices available
          } >> miljo.txt
          xcrun simctl list devices available -j > "$RUNNER_TEMP/enheter.json"
          python3 - "$RUNNER_TEMP/enheter.json" "$SIM_IPHONE" "$SIM_IOS" > sim.env <<'PY'
          import json, re, sys
          fil, namn, ios = sys.argv[1], sys.argv[2], sys.argv[3]
          d = json.load(open(fil))["devices"]
          for x in d.get("com.apple.CoreSimulator.SimRuntime.iOS-" + ios.replace(".", "-"), []):
              if x["name"] == namn:
                  print(f"UDID={x['udid']}\nLAST=ja\nSIM={namn} iOS {ios} (låst)")
                  sys.exit(0)
          def ver(k):
              m = re.search(r"iOS-(\d+)-(\d+)", k)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          for k in sorted(d, key=ver, reverse=True):
              for x in d[k]:
                  if ver(k) >= (18, 2) and x["name"].startswith("iPhone"):
                      v = ver(k)
                      print(f"UDID={x['udid']}\nLAST=nej\nSIM={x['name']} iOS {v[0]}.{v[1]} (INTE den låsta {namn} iOS {ios})")
                      sys.exit(0)
          sys.exit("ingen iPhone med iOS 18.2 eller senare")
          PY
          cat sim.env >> "$GITHUB_ENV"
          echo "== simulatorn" >> miljo.txt
          cat sim.env | tee -a miljo.txt
          grep '^SIM=' sim.env | cut -d= -f2- > sim.txt

      - name: XcodeGen 2.46.0 (låst version, kontrollerad summa)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      # Klubbmodellen ur sin release (S7-2, BESLUT B96): summorna i klubbmodell.json prövas, och
      # provets ritade bilder med PyTorch-modellens rutor läggs där simulatorprovet läser dem.
      - name: Hämta klubbmodellen
        run: python3 tools/hamta_klubbmodell.py --prov /tmp/swinglab_modell/prov

      - name: Generera Xcode-projektet
        id: gen
        run: |
          xcodebuild -version | head -1 > xcode.txt
          xcodegen --version
          xcodegen generate

      - name: Arkivera för telefonen som TestFlight (Release, utan signering)
        run: |
          set -o pipefail
          xcodebuild archive -project SwingLab.xcodeproj -scheme SwingLab -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SwingLab.xcarchive" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee arkiv.log

      - name: Bygg för simulatorn och kör provet (Release med ENABLE_TESTABILITY, som Idunn)
        id: prov
        # Körs även när arkiveringen föll, så att resultatet visar båda.
        # !cancelled(), inte always(): always() körde provet också i en körning som en nyare
        # push avbrutit, och då sparade cancel-in-progress ingen tid (2026-11-05).
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        run: |
          set -o pipefail
          echo "$SIM ($UDID)"
          MAL="platform=iOS Simulator,id=$UDID,arch=arm64"
          {
            # Bygget först, utan simulator: en startad simulator tog CPU från bygget (tre kärnor)
            # och gjorde det tre–fyra gånger långsammare (2026-11-05). Bara arm64
            # (ONLY_ACTIVE_ARCH): provet körs i arm64-simulatorn, och Release byggde x86_64 också.
            xcodebuild build-for-testing -project SwingLab.xcodeproj -scheme SwingLabProv -configuration Release \
              -destination "$MAL" ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES &&
            # Simulatorn startas här och inte av xcodebuild: då står den kvar till jämförelsen
            # (BESLUT B100), som annars väntade 2–3 min på en ny start.
            { SECONDS=0; xcrun simctl boot "$UDID" || true; xcrun simctl bootstatus "$UDID" -b > /dev/null
              echo "simulatorn uppe på ${SECONDS} s"; } &&
            xcodebuild test-without-building -project SwingLab.xcodeproj -scheme SwingLabProv -configuration Release \
              -destination "$MAL" -skip-testing:SwingLabProv/SwingLabProvReferenser \
              ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES
          } 2>&1 | tee prov.log

      # PLAN S4i, BESLUT B100, METOD MS40: galleriet mot Prov/Referenser, i en egen körning av
      # samma bygge. Bara i den låsta miljön, och inte när referenserna spelas in.
      - name: Skärmbilderna mot referenserna
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && env.SPELA_IN != 'ja' }}
        run: |
          set -o pipefail
          if [ "${LAST:-nej}" != "ja" ]; then
            echo "REFERENS: RÖTT: jämförs inte, simulatorn är inte den låsta: ${SIM:-ingen}" | tee referenser.log
            exit 1
          fi
          if ! grep -qE 'Executed [0-9]+ tests?' prov.log; then
            echo "REFERENS: RÖTT: jämförs inte, provet byggdes eller kördes inte" | tee referenser.log
            exit 1
          fi
          xcodebuild test-without-building -project SwingLab.xcodeproj -scheme SwingLabProv -configuration Release \
            -destination "platform=iOS Simulator,id=$UDID,arch=arm64" -only-testing:SwingLabProv/SwingLabProvReferenser \
            ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES 2>&1 | tee referenser.log

      # BESLUT B100: referenserna spelas in i den låsta miljön, bara ur ett grönt prov, och
      # committas till grenen som kompilera kördes på (GITHUB_TOKEN: startar inget nytt flöde).
      # En referens vars skärm inte längre ritas tas bort.
      - name: Spela in referenserna och committa dem (spela_in)
        if: ${{ !cancelled() && steps.gen.outcome == 'success' && env.SPELA_IN == 'ja' }}
        run: |
          set -euo pipefail
          {
            if [ "${LAST:-nej}" != "ja" ]; then
              echo "REFERENS: RÖTT: spelas inte in, simulatorn är inte den låsta: ${SIM:-ingen}"; exit 1
            fi
            if ! grep -q '\*\* TEST EXECUTE SUCCEEDED \*\*' prov.log; then
              echo "REFERENS: RÖTT: spelas inte in, provet föll"; exit 1
            fi
            mkdir -p Prov/Referenser
            for f in Prov/Referenser/*.png; do
              [ -e "$f" ] || continue
              [ -f "/tmp/swinglab_prov/$(basename "$f")" ] || git rm -q "$f"
            done
            cp /tmp/swinglab_prov/*.png Prov/Referenser/
            git add -A Prov/Referenser
            antal=$(ls Prov/Referenser/*.png | wc -l | tr -d ' ')
            if git diff --cached --quiet; then
              echo "REFERENS: SPELADE IN: $antal referenser, alla lika de som redan fanns (ingen commit)"
            else
              status=$(git diff --cached --name-status -- Prov/Referenser)
              nya=$(echo "$status" | grep -c '^A' || true)
              andrade=$(echo "$status" | grep -c '^M' || true)
              borta=$(echo "$status" | grep -c '^D' || true)
              git -c user.name=swinglab-ci -c user.email=swinglab-ci@users.noreply.github.com commit -q \
                -m "Referensbilderna inspelade i kompilera (run ${GITHUB_RUN_ID})" \
                -m "Ur ${GITHUB_SHA} på ${SIM}, $(cat xcode.txt): $nya nya, $andrade ändrade, $borta borttagna (BESLUT B100)."
              git push -q origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
              echo "REFERENS: SPELADE IN: $antal referenser ($nya nya, $andrade ändrade, $borta borttagna) i commit $(git rev-parse HEAD) på ${GITHUB_REF_NAME}"
              echo "$status" | grep -v '^A' | sed 's/^/REFERENS:   /' | head -40 || true
            fi
          } 2>&1 | tee referenser.log

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        with:
          python-version: "3.12"

      - name: PC:n läser appens paket (kontraktet, S2f)
        if: ${{ !cancelled() && steps.gen.outcome == 'success' }}
        run: |
          set -o pipefail
          python -m pip install --quiet numpy opencv-python-headless
          SWINGLAB_APPENS_PAKET=/tmp/swinglab_prov/paket \
            python -m unittest discover -s tools/tests -p test_appens_paket.py -v 2>&1 | tee pc.log

      - name: Lägg sammanfattningen på ci-resultat
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "${GITHUB_SHA} ${GITHUB_REF_NAME} $(date -u +%FT%TZ) run ${GITHUB_RUN_ID} kompilera$([ "$SPELA_IN" = ja ] && echo ' spela_in' || true)"
            echo "$(cat xcode.txt 2>/dev/null || echo 'Xcode okänd') · $(cat sim.txt 2>/dev/null || echo 'ingen simulator') · ${ImageOS:-?} ${ImageVersion:-?}"
            echo "== arkiv (telefonen, Release, utan signering: TestFlights bygge)"
            if [ ! -f arkiv.log ]; then
              echo "RÖTT: ingen arkivlogg (föll ett steg före arkiveringen)"
              grep -E '^RÖTT' miljo.txt 2>/dev/null || true
            elif grep -q '\*\* ARCHIVE SUCCEEDED \*\*' arkiv.log; then
              echo "GRÖNT: ARCHIVE SUCCEEDED"
            else
              echo "RÖTT: arkiveringen gick inte igenom"
              grep -E 'error:|\*\* ARCHIVE FAILED \*\*' arkiv.log | head -30 || true
            fi
            echo
            if [ ! -f prov.log ]; then
              echo "== prov"
              echo "RÖTT: provet kördes inte"
            else
              python3 tools/arbetssatt/ci_sammanfattning.py prov.log || true
              # Bygget och provet är två körningar (TEST BUILD, TEST EXECUTE); testflight.yml läser
              # "** TEST SUCCEEDED **", som betyder att båda gick igenom.
              if grep -q '\*\* TEST BUILD SUCCEEDED \*\*' prov.log && grep -q '\*\* TEST EXECUTE SUCCEEDED \*\*' prov.log; then
                echo "** TEST SUCCEEDED **"
              fi
              grep -E 'error:|\*\* TEST (BUILD |EXECUTE )?(FAILED|SUCCEEDED) \*\*' prov.log | head -20 || true
            fi
            echo
            # PLAN S4i, BESLUT B100, METOD MS40.
            echo "== skärmbilderna mot referenserna (Prov/Referenser, BESLUT B100, METOD MS40)"
            if [ ! -f referenser.log ]; then
              echo "RÖTT: jämförelsen kördes inte"
            else
              grep -E '^REFERENS: ' referenser.log | sed 's/^REFERENS: //' | head -60 || true
              if grep -q '^REFERENS: RÖTT' referenser.log; then
                true
              elif [ "$SPELA_IN" = "ja" ]; then
                if ! grep -q '^REFERENS: SPELADE IN' referenser.log; then
                  echo "RÖTT: inspelningen gick inte igenom"
                  tail -5 referenser.log
                fi
              elif ! grep -q '\*\* TEST EXECUTE SUCCEEDED \*\*' referenser.log; then
                echo "RÖTT: jämförelsen föll"
                grep -E 'error:|\*\* TEST FAILED \*\*' referenser.log | head -10 || true
              fi
              for BILD in /tmp/swinglab_prov/skillnad/*.png; do
                if [ -f "$BILD" ]; then echo "  bild: resultat/${GITHUB_SHA}.skillnad.$(basename "$BILD")"; fi
              done
            fi
            echo
            # METOD MS41: huvudskärmarna i tre textstorlekar, mörkt och ljust.
            echo "== matrisen: textstorlek × mörkt/ljust (resultat/<sha>.matris.<namn>.png, METOD MS41)"
            if [ -f prov.log ]; then grep -E '^MATRIS: ' prov.log | sed 's/^MATRIS: //' | head -20 || true; fi
            echo
            if [ -f prov.log ]; then
              echo "== provets mätningar (påhittad film)"
              grep -E '^PROV: ' prov.log | head -160 || true
              # S2k: förhandsbildens mätningar, också när raderna ovan nått taket.
              echo "== den andra telefonens bild (S2k, METOD MS35)"
              grep -E '^PROV: förhandsbild' prov.log || true
              # S7-2: Core ML mot PyTorch, också när raderna ovan nått taket.
              echo "== klubbmodellen (S7-2, BESLUT B96)"
              grep -E '^PROV: klubbmodell' prov.log || true
            fi
            echo
            echo "== PC:n läser appens paket (tools/tests/test_appens_paket.py)"
            if [ ! -f pc.log ]; then
              echo "RÖTT: PC-steget kördes inte"
            elif grep -qE '^OK$' pc.log && ! grep -q 'skipped' pc.log; then
              echo "GRÖNT: paket.py och session.py läste paketen som appen skrev"
            else
              echo "RÖTT: PC:n läste inte appens paket"
              grep -E '^(FAIL|ERROR|AssertionError|.*Error:)' pc.log | head -20 || true
            fi
            grep -E '^PAKET: ' pc.log | head -20 || true
          } > "$RUNNER_TEMP/resultat.txt"
          cat "$RUNNER_TEMP/resultat.txt"
          TOKEN="${{ github.token }}"
          for i in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/r" && mkdir "$RUNNER_TEMP/r" && cd "$RUNNER_TEMP/r" && git init -q
            git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q origin ci-resultat 2>/dev/null; then git checkout -q -b ci-resultat FETCH_HEAD; else git checkout -q --orphan ci-resultat; fi
            mkdir -p resultat
            cp "$RUNNER_TEMP/resultat.txt" "resultat/${GITHUB_SHA}.kompilera.txt"
            cp "$RUNNER_TEMP/resultat.txt" senaste-kompilera.txt
            if [ -f "$GITHUB_WORKSPACE/miljo.txt" ]; then cp "$GITHUB_WORKSPACE/miljo.txt" "resultat/${GITHUB_SHA}.miljo.txt"; fi
            for BILD in /tmp/swinglab_prov/*.png; do
              if [ -f "$BILD" ]; then cp "$BILD" "resultat/${GITHUB_SHA}.$(basename "$BILD")"; fi
            done
            for BILD in /tmp/swinglab_prov/skillnad/*.png; do
              if [ -f "$BILD" ]; then cp "$BILD" "resultat/${GITHUB_SHA}.skillnad.$(basename "$BILD")"; fi
            done
            for BILD in /tmp/swinglab_prov/matris/*.png; do
              if [ -f "$BILD" ]; then cp "$BILD" "resultat/${GITHUB_SHA}.matris.$(basename "$BILD")"; fi
            done
            git add -A && git -c user.name=swinglab-ci -c user.email=swinglab-ci@users.noreply.github.com commit -qm "kompilera ${GITHUB_SHA}"
            git push -q origin ci-resultat && break
            sleep $((i * 3))
          done

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: swinglab-paket
          path: /tmp/swinglab_prov/paket
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: kompilera-loggar
          path: |
            arkiv.log
            prov.log
            referenser.log
            miljo.txt
            pc.log
          if-no-files-found: ignore

# TestFlight-bygget i GitHub Actions (BESLUT B7, S2_SPEC §10.3), kopierat från
# Airtime. Repot är publikt, så macOS-maskinerna kostar inget. Codemagics öppna
# kommandoradsverktyg (codemagic-cli-tools) hämtar signeringen och laddar upp.
#
# Startas bara för hand ("Run workflow" eller API:t), efter Johannes ja, och bara
# från main. Aldrig av push, tagg eller pull request: då
# når ingen utomstående hemligheterna. Hemligheterna ges bara till stegen som
# behöver dem.
#
# Bygget kräver grönt i kompilera.yml (BESLUT B20): för samma commit, eller för
# närmaste tidigare commit med ett resultat om inget som kompilera prövar
# (App/, Prov/, SwingLabKit/, project.yml, kompilera.yml) har ändrats sedan dess.
# En commit som bara rör docs kan alltså byggas utan att kompilera körs om.

name: testflight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.repository == 'birdiebook/swinglab'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Bara från main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "FEL: TestFlight byggs bara från main, inte från $GITHUB_REF." >&2; exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # Hela historiken, så att spärren nedan kan jämföra med en tidigare commit.
          fetch-depth: 0

      - name: Hemligheterna finns
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          for n in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!n}" ]; then echo "FEL: hemligheten $n saknas (README, Första gången)." >&2; exit 1; fi
          done
          # Läxa 2026-10-22: en .p8 utan BEGIN/END-raderna föll först i "Hämta signering".
          if ! printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "FEL: APP_STORE_CONNECT_PRIVATE_KEY är inte hela .p8-filen (från -----BEGIN PRIVATE KEY----- till -----END PRIVATE KEY-----)." >&2; exit 1
          fi

      - name: Kompilera är grönt för det som byggs
        run: |
          set -euo pipefail
          git fetch -q origin ci-resultat:refs/remotes/origin/ci-resultat
          BAS=""
          for c in $(git rev-list --max-count=500 HEAD); do
            if git cat-file -e "origin/ci-resultat:resultat/${c}.kompilera.txt" 2>/dev/null; then BAS=$c; break; fi
          done
          if [ -z "$BAS" ]; then
            echo "FEL: ingen commit fram till ${GITHUB_SHA} har ett kompilera-resultat. Kör kompilera för hand." >&2; exit 1
          fi
          RES=$(git show "origin/ci-resultat:resultat/${BAS}.kompilera.txt")
          echo "$RES"
          if echo "$RES" | grep -q "RÖTT" \
             || ! echo "$RES" | grep -q "GRÖNT: ARCHIVE SUCCEEDED" \
             || ! echo "$RES" | grep -q '\*\* TEST SUCCEEDED \*\*'; then
            echo "FEL: kompilera är inte grönt för ${BAS}." >&2; exit 1
          fi
          if [ "$BAS" != "$GITHUB_SHA" ]; then
            if ! git diff --quiet "$BAS" "$GITHUB_SHA" -- App Prov SwingLabKit project.yml .github/workflows/kompilera.yml; then
              echo "FEL: appen har ändrats sedan ${BAS}, det senaste kompilera-resultatet. Kör kompilera för ${GITHUB_SHA}." >&2
              git diff --stat "$BAS" "$GITHUB_SHA" -- App Prov SwingLabKit project.yml .github/workflows/kompilera.yml >&2
              exit 1
            fi
            echo "Grönt för ${BAS}; inget som kompilera prövar har ändrats fram till ${GITHUB_SHA}."
          fi

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verktygen (låsta versioner)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
          pip install "codemagic-cli-tools==0.70.0"

      - name: Generera Xcode-projektet
        run: xcodegen generate

      - name: Sätt buildnummer
        run: agvtool new-version -all "$GITHUB_RUN_NUMBER"

      - name: Hämta signering
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/cert_key.pem"
          grep -q "BEGIN.*PRIVATE KEY" "$RUNNER_TEMP/cert_key.pem"
          # --create registrerar profilen första gången.
          app-store-connect fetch-signing-files "se.birdiebook.swinglab" \
            --type IOS_APP_STORE \
            --certificate-key=@file:"$RUNNER_TEMP/cert_key.pem" \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Arkivera
        run: |
          set -o pipefail
          xcode-project build-ipa --project "SwingLab.xcodeproj" --scheme "SwingLab"

      - name: Ladda upp till TestFlight
        # Den interna testgruppen har automatisk distribution och får bygget av sig själv.
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"

      - name: Städa
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/cert_key.pem"
          keychain use-login || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-loggar
          path: /tmp/xcodebuild_logs/*.log
          if-no-files-found: ignore

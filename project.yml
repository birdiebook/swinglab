# Xcode-projektet genereras ur den här filen (XcodeGen) och är gitignorerat.
# Ingen Mac behövs: GitHub Actions kör `xcodegen generate` före bygget
# (kompilera.yml för simulatorn, testflight.yml för telefonen). S2_SPEC §10.1.
name: SwingLab
options:
  bundleIdPrefix: se.birdiebook
  # BESLUT B30: appen är på engelska, grundspråket för App/Localizable.xcstrings (B33).
  developmentLanguage: en
  # BESLUT B19: 18.2 för filens starttid på telefonens klocka (startPTS).
  deploymentTarget:
    iOS: "18.2"
packages:
  SwingLabKit:
    path: SwingLabKit
targets:
  SwingLab:
    type: application
    platform: iOS
    sources:
      - App
      # Katalogen (BESLUT B6) i appen: passets mått och granskningens positioner (S4b).
      - path: katalog.json
        buildPhase: resources
      # Klubbmodellen (S7-2, BESLUT B96): hämtas ur sin release av bygget (tools/hamta_klubbmodell.py,
      # gitignorerad). Xcode kompilerar paketet till Klubbmodell.mlmodelc; utan hämtningen finns
      # ingen modell, och appen klarar sig utan (KlubbModellKorning.iAppen ger nil).
      - path: Modeller/Klubbmodell.mlpackage
        type: file
        buildPhase: sources
        optional: true
      - path: Modeller/Klubbmodell.json
        buildPhase: resources
        optional: true
    dependencies:
      - package: SwingLabKit
        product: Swing
      - package: SwingLabKit
        product: Capture
      # 3D ur två telefoner på telefonen (S6c-2, BESLUT B61).
      - package: SwingLabKit
        product: TreD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.birdiebook.swinglab
        MARKETING_VERSION: "0.1.0"
        # Skrivs över av testflight.yml (agvtool) vid varje bygge.
        CURRENT_PROJECT_VERSION: "1"
        VERSIONING_SYSTEM: apple-generic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Swift 6:s stränga samtidighetskontroll ger fel som inte syns på Linux (som Airtime och Idunn).
        SWIFT_VERSION: "5.0"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: SwingLab
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Utan den här fastnar varje bygge på exportfrågan i App Store Connect.
        ITSAppUsesNonExemptEncryption: false
        # Texterna visas i frågorna om tillåtelse (S2_SPEC §10.1), på engelska (BESLUT B30).
        # Saknas en kraschar appen vid frågan.
        NSCameraUsageDescription: SwingLab films your swing in slow motion. The video stays on the phone.
        NSMicrophoneUsageDescription: SwingLab records sound to find the click of impact. The sound stays on the phone.
        NSPhotoLibraryUsageDescription: SwingLab loads the slow-motion original from Photos to measure your swing.
        # S6b, METOD MS17: CMMotionManager har en tillåtelse från iOS 27.2 (authorizationStatus);
        # utan nyckeln kan appen krascha vid frågan. Inte bekräftat i original, oprövat på iOS 27.2.
        NSMotionUsageDescription: SwingLab reads the phone's tilt to measure the swing in 3D.
        # BESLUT B21: två telefoner över Network.framework med Bonjour.
        NSLocalNetworkUsageDescription: SwingLab connects two phones filming the same swing.
        NSBonjourServices:
          - _swinglab._tcp
        # Documents/Export syns i Filer och i Apple Devices över kabel (som Idunn).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # S5b-2, BESLUT B60: "Open Claude" visas bara när Claude-appen finns, och canOpenURL svarar
        # bara för scheman som står här.
        LSApplicationQueriesSchemes:
          - claude
    scheme: {}

  # BESLUT B20. Simulatorprovet: körs inuti appen (TEST_HOST) av kompilera.yml vid
  # varje push som rör appen, aldrig av TestFlight. S2_SPEC §10.2.
  SwingLabProv:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Prov
    dependencies:
      - target: SwingLab
      - package: SwingLabKit
        product: Swing
      - package: SwingLabKit
        product: Capture
      # Påhittade pass och svingar för vyernas bilder (S4); appen länkar inte in det.
      - package: SwingLabKit
        product: SwingDemo
      # 3D på telefonen (S6c-1): byggs och körs på Darwin redan nu, före appen (S6c-2).
      - package: SwingLabKit
        product: TreD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: se.birdiebook.swinglab.prov
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.0"
        # Testet körs inuti appen, så att `@testable import SwingLab` når vyerna.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwingLab.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SwingLab"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # Simulatorn kräver ingen signering.
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  # Eget schema, så att `SwingLab`-schemat som TestFlight arkiverar är orört.
  SwingLabProv:
    build:
      targets:
        SwingLab: all
        SwingLabProv: [test]
    test:
      # Release som TestFlight; kompilera.yml sätter ENABLE_TESTABILITY=YES (som Idunn).
      config: Release
      # Engelska i en svensk region: provet visar att en svensk telefon får
      # decimalpunkt och engelska datum (BESLUT B30, B33).
      language: en
      region: SE
      targets:
        - SwingLabProv
